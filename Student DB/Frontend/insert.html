<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body style="background-color: rgb(185, 117, 248);">
    <div class="containor mt-5 mb-5" style="background-color: rgb(185, 117, 248);">
        <div class="row sm-6">
            <div class="d-flex justify-content-center">
                <div class="col-md-6">
                    <div class="card border-primary m-3 p-3">
                        <div class="card-body m-3 p-3">
                            <h1 class="text-center">Insert New Student</h1>
                            <form action="http://localhost:8080/student/details" method="post">
                                <div class="mb-3">
                                    <label for="rollno" class="form-label">Roll No:</label>
                                    <input type="text" class="form-control border" name="rollno" required>
                                </div>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Name:</label>
                                    <input type="text" class="form-control" name="name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="course" class="form-label">Course Name:</label>
                                    <input type="text" class="form-control" name="course" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email:</label>
                                    <input type="email" class="form-control" name="email" required>
                                </div>
                                <button type="submit" class="btn btn-primary m-3">Submit</button>
                                <button type="reset" class="btn btn-secondary">Reset</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
