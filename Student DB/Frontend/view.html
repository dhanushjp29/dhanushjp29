<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body style="background-color: rgb(185, 117, 248);">

    <div class="container mt-5 mb-5"style="background-color: rgb(185, 117, 248);">
        <div class="row sm-6">
            <div class="d-flex justify-content-center">
                <div class="col-md-8">
                    <div class="card border-black m-3 p-3">
                        <div class="card-body m-3 p-3">
                            <h1 class="text-center p-3">View Students</h1>
                            <table class="table table-striped table-bordered table-border-dark">
                                <thead>
                                    <tr>
                                        <th>Roll No</th>
                                        <th>Name</th>
                                        <th>Course Name</th>
                                        <th>Email</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody">
                                    <!-- Student data will be inserted here -->
                                </tbody>

                            </table>
                            <button class="btn btn-primary m-3" onclick="StudentsDetails()">Refresh</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

        <script type="text/javascript">
            function StudentsDetails(){
                fetch("http://localhost:8080/students") //API End point
                .then((response) => response.json()) //Http response into json object
                .then((students) => {
                    const dataTable = document.getElementById("studentTableBody");
                    let rows = "";
                    students.forEach(student => {
                        rows += `<tr>
                        <td>${student.rollno}</td>
                        <td>${student.name}</td>
                        <td>${student.course}</td>
                        <td>${student.email}</td>
                        </tr>`;
                    });
                    dataTable.innerHTML = rows;
                });
            }
        </script>
</body>

</html>
