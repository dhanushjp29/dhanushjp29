<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #667eea, #764ba2);
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
      transition: background 0.3s, color 0.3s;
    }
    body.light-mode {
      background: #f5f5f5;
      color: #333;
    }
    .weather-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(15px);
      text-align: center;
      max-width: 420px;
      width: 100%;
      transition: all 0.3s ease;
    }
    .light-mode .weather-card {
      background: rgba(255, 255, 255, 0.95);
      color: #000;
    }
    .weather-card:hover {
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
    }
    .form-control {
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 1rem;
    }
    .btn-check-weather {
      border-radius: 50px;
      padding: 10px 30px;
      font-weight: 500;
      background-color: #fff;
      color: #764ba2;
      border: none;
      transition: all 0.3s ease;
    }
    .btn-check-weather:hover {
      background-color: #f2f2f2;
    }
    .weather-icon {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    #temperature {
      font-size: 2.5rem;
      font-weight: 700;
    }
    #description {
      font-size: 1.2rem;
      text-transform: capitalize;
    }
    .details {
      font-size: 0.95rem;
      margin-top: 10px;
    }
    #suggestions {
      position: absolute;
      background: #fff;
      color: #000;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      max-height: 200px;
      overflow-y: auto;
      z-index: 999;
      width: 100%;
      left: 0;
    }
    #suggestions div {
      padding: 10px 15px;
      cursor: pointer;
    }
    #suggestions div:hover,
    #suggestions div.active {
      background-color: #e0e0e0;
    }
    .mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #fff;
      color: #764ba2;
      border: none;
      border-radius: 20px;
      padding: 5px 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
  </style>
</head>
<body>
  <button class="mode-toggle" onclick="toggleMode()">Toggle Mode</button>
  <div class="weather-card position-relative">
    <h2>🌦️ Weather Forecast</h2>
    <div class="position-relative">
      <input type="text" id="cityInput" class="form-control mb-3" placeholder="Enter city name" autocomplete="on" />
      <div id="suggestions" class="d-none"></div>
    </div>
    <button class="btn btn-check-weather mb-4" onclick="getWeather()">Check Weather</button>
    <div id="weatherResult" class="d-none">
      <h3 id="cityName"></h3>
      <img id="weatherIcon" class="weather-icon" src="" alt="Weather Icon">
      <div id="temperature"></div>
      <p id="description"></p>
      <div class="details">
        <p><strong>Feels Like:</strong> <span id="feelsLike"></span></p>
        <p><strong>Humidity:</strong> <span id="humidity"></span></p>
        <p><strong>Wind:</strong> <span id="wind"></span></p>
      </div>
    </div>
  </div>
  <script>
    function toggleMode() {
      document.body.classList.toggle('light-mode');
    }

    const cityInput = document.getElementById("cityInput");
    const suggestionsBox = document.getElementById("suggestions");
    let suggestions = [];
    let selectedIndex = -1;

    cityInput.addEventListener("input", async () => {
      const query = cityInput.value.trim();
      if (query.length < 2) {
        suggestionsBox.classList.add("d-none");
        return;
      }

      try {
        const response = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${query}&limit=5&appid=7a6c6a29f82beb5231c6e042df8271c8`);
        const data = await response.json();

        suggestions = data;
        suggestionsBox.innerHTML = "";
        selectedIndex = -1;

        if (data.length > 0) {
          suggestionsBox.classList.remove("d-none");
          data.forEach((city, index) => {
            const div = document.createElement("div");
            div.textContent = `${city.name}, ${city.country}`;
            div.setAttribute("data-index", index);
            div.onclick = () => selectCity(index);
            suggestionsBox.appendChild(div);
          });
        } else {
          suggestionsBox.classList.add("d-none");
        }
      } catch (error) {
        console.error("Error fetching suggestions:", error);
        suggestionsBox.classList.add("d-none");
      }
    });

    cityInput.addEventListener("keydown", (e) => {
      const items = suggestionsBox.querySelectorAll("div");

      if (e.key === "ArrowDown") {
        if (selectedIndex < items.length - 1) {
          selectedIndex++;
          updateHighlight(items);
        }
      } else if (e.key === "ArrowUp") {
        if (selectedIndex > 0) {
          selectedIndex--;
          updateHighlight(items);
        }
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (selectedIndex >= 0) {
          selectCity(selectedIndex);
        } else {
          getWeather();
        }
      }
    });

    function updateHighlight(items) {
      items.forEach(item => item.classList.remove("active"));
      if (selectedIndex >= 0) {
        items[selectedIndex].classList.add("active");
      }
    }

    function selectCity(index) {
      cityInput.value = `${suggestions[index].name}`;
      suggestionsBox.classList.add("d-none");
      getWeather();
    }

    document.addEventListener("click", (e) => {
      if (!suggestionsBox.contains(e.target) && e.target !== cityInput) {
        suggestionsBox.classList.add("d-none");
      }
    });

    async function getWeather() {
      const city = cityInput.value;
      const apiKey = "7a6c6a29f82beb5231c6e042df8271c8";

      if (!city) return alert("Please enter a city name");

      try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`);
        const data = await response.json();

        if (data.cod === 200) {
          document.getElementById("weatherResult").classList.remove("d-none");
          document.getElementById("cityName").textContent = `${data.name}, ${data.sys.country}`;
          document.getElementById("temperature").textContent = `${data.main.temp}°C`;
          document.getElementById("description").textContent = data.weather[0].description;
          document.getElementById("weatherIcon").src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
          document.getElementById("feelsLike").textContent = `${data.main.feels_like}°C`;
          document.getElementById("humidity").textContent = `${data.main.humidity}%`;
          document.getElementById("wind").textContent = `${data.wind.speed} m/s`;
        } else {
          alert("City not found");
        }
      } catch (error) {
        alert("Error fetching data");
        console.error(error);
      }
    }
  </script>
</body>
</html>
